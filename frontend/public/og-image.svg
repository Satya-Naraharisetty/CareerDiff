<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="850" y1="0" x2="850" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1150" y1="0" x2="1150" y2="630"/>

    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Glowing Radial Accent -->
  <circle cx="200" cy="150" r="280" fill="#6366f1" opacity="0.15" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="240" fill="#10b981" opacity="0.1" filter="blur(80px)"/>

  <!-- Logo Pill Badge -->
  <rect x="100" y="90" width="220" height="42" rx="21" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <circle cx="122" cy="111" r="6" fill="#10b981"/>
  <text x="140" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c7d2fe" letter-spacing="1">INTERVUEX AI ENGINE</text>

  <!-- Main Headline -->
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Autonomous Technical
  </text>
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#brandGrad)" letter-spacing="-1">
    Interview Simulator &amp; Rubric Engine
  </text>

  <!-- Subtitle -->
  <text x="100" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Adaptive voice &amp; text mock interviews calibrated directly to your resume claims
  </text>
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    and target Job Description, with decoupled 4-tier rubric assessments.
  </text>

  <!-- Feature Tags -->
  <g transform="translate(100, 440)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="230" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">📄 Resume Claim Grounding</text>

    <!-- Tag 2 -->
    <rect x="250" y="0" width="230" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="274" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">🎯 Dynamic JD Calibration</text>

    <!-- Tag 3 -->
    <rect x="500" y="0" width="230" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="524" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">🎙️ Adaptive Turn Engine</text>

    <!-- Tag 4 -->
    <rect x="750" y="0" width="240" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="774" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">📊 4-Tier Rubric Dossier</text>
  </g>

  <!-- Footer Meta -->
  <line x1="100" y1="540" x2="1100" y2="540" stroke="#1e293b" stroke-width="1"/>
  <text x="100" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b">intervuex.dev</text>
  <text x="1100" y="580" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b">Production-Grade AI Engineering Practice</text>
</svg>
